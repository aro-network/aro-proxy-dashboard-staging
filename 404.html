
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiData Proxy</title>
    <script>
      (function () {
        const location = window.location;
        const params = new URLSearchParams();

        params.set('p', location.pathname.replace(/&/g, '~and~'));

        if (location.search.length > 1) {
          params.set('q', location.search.slice(1).replace(/&/g, '~and~'));
        }

        location.replace(`${location.origin}/?${params.toString()}${location.hash}`);
      })();
    </script>
  </head>
  <body></body>
</html>
